<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <clipPath id="squircle">
      <rect x="0" y="0" width="512" height="512" rx="114" ry="114"/>
    </clipPath>
  </defs>

  <g clip-path="url(#squircle)">
    <rect width="512" height="512" fill="#101714"/>
    <g transform="translate(-8.00 20.60) scale(22.0000)" fill="none" stroke="#f2f1e9" stroke-width="1.2" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="8">
      <path d="M5 10l-1-6 5 3q3-1.1 6 0l5-3-1 6a7.4 7.4 0 0 1-14 0z"/>
    </g>
  </g>

  <!-- Rim light. A dark tile on a dark taskbar loses its own edge; a hairline of
       the accent gives it back without lightening the art. -->
  <rect x="3" y="3" width="506" height="506" rx="111" ry="111"
        fill="none" stroke="#a7c8ac" stroke-opacity="0.72" stroke-width="6"/>
</svg>