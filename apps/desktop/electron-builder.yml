appId: dev.nekkolabs.agentnekko
productName: Agent Nekko
# electron-builder 26 derives this from the npm package name (@agent-nekko/desktop
# → "@agent-nekkodesktop") and then rejects the @ as unsafe, so pin it. Spelled
# without the space in "Agent Nekko" on purpose: this is the on-disk binary
# name, and artifactName below matches it so download URLs need no escaping.
executableName: AgentNekko
copyright: Copyright © 2026 Nekko Labs
afterPack: scripts/after-pack.cjs
directories:
  output: release
  buildResources: build
icon: build/icon
files:
  - out/**/*
  - package.json
# @lydell/node-pty ships a native .node binary that must live outside the asar
# archive so it can be dlopen'd at runtime (and its prebuilt platform package).
asarUnpack:
  - "**/node_modules/@lydell/node-pty/**"
  - "**/node_modules/@lydell/node-pty-*/**"
extraMetadata:
  main: out/main/index.js
# macOS resolves URL schemes from Info.plist, so setAsDefaultProtocolClient in
# main is not enough for a packaged build. Older brand schemes stay listed: a
# Hypergate built against one of them still emits it.
protocols:
  - name: Agent Nekko
    schemes:
      - agent-nekko
      - kotrain
      - nekkos
publish:
  provider: github
  owner: nekko-labs
  repo: agent-nekko
win:
  target:
    - nsis
  artifactName: AgentNekko-${version}-${arch}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  installerSidebar: build/installerSidebar.bmp
  installerHeader: build/installerHeader.bmp
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  # Add/Remove Programs + Start Menu uninstall entry, with a Start Menu folder.
  menuCategory: true
  createStartMenuShortcut: true
  uninstallDisplayName: Agent Nekko
  # Custom uninstall hook lives at build/installer.nsh, electron-builder picks
  # it up automatically (its customUnInstall macro offers to remove user data).
msi:
  oneClick: false
mac:
  target:
    - dmg
    - zip
  category: public.app-category.developer-tools
  artifactName: AgentNekko-${version}-${arch}.${ext}
  # Developer ID signing + notarization. electron-builder signs when CSC_LINK
  # and CSC_KEY_PASSWORD are in the environment, and skips signing entirely
  # when they are not — in which case the afterPack hook ad-hoc signs instead
  # so the build still launches locally. Release CI sets them from the
  # nekko-labs org secrets; see docs/signing.md.
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Left off here on purpose: notarization needs the App Store Connect key,
  # which only the release workflow has. It turns this on with
  # `-c.mac.notarize=true` rather than failing every local `npm run dist`.
  notarize: false
  gatekeeperAssess: false
  extendInfo:
    # Required for the QR pairing scanner (QrScanner.tsx → getUserMedia).
    # Without it macOS kills the process instead of prompting.
    NSCameraUsageDescription: Agent Nekko uses the camera to scan the pairing QR code shown by the Agent Nekko mobile app.
linux:
  target:
    - AppImage
    - deb
  category: Development
  syncDesktopName: true
  artifactName: AgentNekko-${version}-${arch}.${ext}
deb:
  # Replace this GitHub noreply fallback when the project publishes a mailbox.
  maintainer: Nekko Labs <nekko-labs@users.noreply.github.com>
  synopsis: Local-first AI coding and cowork assistant
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
