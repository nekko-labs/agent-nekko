name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      # Build every workspace first: the cloud test suite imports @agent-nekko/host,
      # and @agent-nekko/server imports the CLI package, so their dists must exist
      # before `npm test` / typecheck run.
      - run: npm run build:web
      - run: npm test
      - run: npm run test:cli-package
      - run: npm run typecheck
