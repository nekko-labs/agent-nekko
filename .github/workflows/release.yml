name: Release

on:
  push:
    tags:
      - 'v*'
  # Dispatched at a tag by version-release.yml (a tag pushed with GITHUB_TOKEN
  # can't trigger the push event above), and usable by hand to re-run a release
  # for an existing tag. Run it with `--ref v1.2.3` so `github.ref_name` is the
  # tag, which is what every step below reads.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    # Signing is secret-gated: with no signing secrets configured the macOS
    # build ships unsigned (ad-hoc signed by the afterPack hook), exactly as it
    # did before. The env indirection exists because `secrets` cannot be read
    # in a step-level `if`. Secret names and setup: docs/signing.md.
    env:
      MACOS_SIGNING_CERTS_P12: ${{ secrets.MACOS_SIGNING_CERTS_P12 }}
      APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
      WINDOWS_SIGNING_CERTS_P12: ${{ secrets.WINDOWS_SIGNING_CERTS_P12 }}
    steps:
      - uses: actions/checkout@v7

      # A tagged release that is *partially* configured is the dangerous case:
      # it would publish a signed-but-unnotarized app that Gatekeeper still
      # blocks, and look like it worked. Fail before building instead.
      - name: Validate macOS signing configuration
        if: runner.os == 'macOS'
        shell: bash
        env:
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          set -euo pipefail

          # The certificate is what decides whether we sign at all, so it is
          # the gate. No cert means an unsigned build, which is a supported
          # outcome, not an error — even if stray notarization secrets are
          # lying around.
          #
          # (Hypergate fails on *any* partially populated set. That is stricter
          # than it needs to be: it turns a leftover secret into a hard build
          # failure while the cert is still missing.)
          if [ -z "${MACOS_SIGNING_CERTS_P12:-}" ]; then
            echo 'No Developer ID certificate configured, building unsigned.'
            for name in MACOS_CERT_PASSWORD APPLE_API_KEY_P8 APPLE_API_KEY_ID APPLE_API_ISSUER; do
              if [ -n "${!name:-}" ]; then
                echo "Note: $name is set but unused without MACOS_SIGNING_CERTS_P12." >&2
              fi
            done
            exit 0
          fi

          # A cert *is* present, so this build will be signed. Anything missing
          # now yields a signed-but-unnotarized app: still Gatekeeper-blocked,
          # while looking like the release worked. Fail before building.
          missing=()
          for name in MACOS_CERT_PASSWORD APPLE_API_KEY_P8 APPLE_API_KEY_ID APPLE_API_ISSUER; do
            [ -n "${!name:-}" ] || missing+=("$name")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'macOS signing configuration is incomplete. Missing: %s\n' "${missing[*]}" >&2
            exit 1
          fi
          echo 'macOS signing fully configured.'

      - name: Validate Windows signing configuration
        if: runner.os == 'Windows'
        shell: bash
        env:
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${WINDOWS_SIGNING_CERTS_P12:-}" ]; then
            echo 'No Authenticode certificate configured, building unsigned.'
            if [ -n "${WINDOWS_CERT_PASSWORD:-}" ]; then
              echo 'Note: WINDOWS_CERT_PASSWORD is set but unused without WINDOWS_SIGNING_CERTS_P12.' >&2
            fi
            exit 0
          fi
          if [ -z "${WINDOWS_CERT_PASSWORD:-}" ]; then
            echo 'Windows signing configuration is incomplete. Missing: WINDOWS_CERT_PASSWORD' >&2
            exit 1
          fi
          echo 'Windows signing fully configured.'

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      # Build installers (Windows: NSIS, macOS: dmg/zip, Linux:
      # AppImage/deb) and upload them to a draft GitHub Release for this tag.
      #
      # electron-builder reads WIN_CSC_LINK/WIN_CSC_KEY_PASSWORD for Windows
      # Authenticode and CSC_LINK/CSC_KEY_PASSWORD for macOS, and
      # APPLE_API_KEY (a *path* to the .p8, hence the temp file) with
      # APPLE_API_KEY_ID/APPLE_API_ISSUER to notarize.
      - name: Build and publish installers
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.MACOS_SIGNING_CERTS_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          WINDOWS_SIGNING_CERTS_P12: ${{ secrets.WINDOWS_SIGNING_CERTS_P12 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          EXTRA=""
          if [ "$RUNNER_OS" = "Windows" ] && [ -n "${WINDOWS_SIGNING_CERTS_P12:-}" ]; then
            export WIN_CSC_LINK="$WINDOWS_SIGNING_CERTS_P12"
            export WIN_CSC_KEY_PASSWORD="$WINDOWS_CERT_PASSWORD"
            unset CSC_LINK CSC_KEY_PASSWORD
            echo 'Windows: signing with Authenticode certificate.'
          elif [ "$RUNNER_OS" = "Windows" ]; then
            unset CSC_LINK CSC_KEY_PASSWORD WIN_CSC_LINK WIN_CSC_KEY_PASSWORD
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            echo 'Windows: building UNSIGNED (no Authenticode certificate configured).'
          elif [ "$RUNNER_OS" = "macOS" ] && [ -n "${CSC_LINK:-}" ]; then
            key="$RUNNER_TEMP/notary-api-key.p8"
            # Subshell so the restrictive umask applies to the key file only,
            # not to every artifact the build writes afterwards.
            (umask 077; printf '%s' "$APPLE_API_KEY_P8" > "$key")
            export APPLE_API_KEY="$key"
            EXTRA="-c.mac.notarize=true"
            echo 'macOS: signing with Developer ID and notarizing.'
          else
            # No certificate. Clear the signing env so electron-builder does not
            # try to sign with an empty cert path, and let the afterPack hook
            # ad-hoc sign instead.
            unset CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            if [ "$RUNNER_OS" = "macOS" ]; then
              echo 'macOS: building UNSIGNED (no Developer ID cert configured).'
            fi
          fi
          npm run release -w @agent-nekko/desktop -- $EXTRA

      # Proof the artifact is actually distributable, rather than trusting that
      # the build steps above did what they claim.
      - name: Verify the signed app
        if: runner.os == 'macOS' && env.MACOS_SIGNING_CERTS_P12 != ''
        shell: bash
        run: |
          set -euo pipefail
          app=$(find apps/desktop/release -maxdepth 2 -name '*.app' -print -quit)
          if [ -z "$app" ]; then
            echo 'No .app found to verify.' >&2
            exit 1
          fi
          echo "Verifying $app"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv --verbose=4 "$app" 2>&1 | grep -E 'Authority|TeamIdentifier|flags'
          # The notarization ticket is stapled to the .app, not to the .dmg
          # that wraps it, so this is the artifact to validate.
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=4 "$app"

  publish-release:
    name: Publish GitHub release
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish tagged release with generated notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          prerelease=false
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            prerelease=true
          fi
          # Look the release up by listing rather than via /releases/tags/{tag}.
          # That endpoint only resolves *published* releases and 404s on a
          # draft, which is exactly what electron-builder just created, so the
          # job could never publish the thing it was written to publish.
          release=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq "map(select(.tag_name == \"$GITHUB_REF_NAME\")) | first")
          if [ -z "$release" ] || [ "$release" = "null" ]; then
            echo "No release found for tag $GITHUB_REF_NAME." >&2
            exit 1
          fi
          release_id=$(jq -r '.id' <<<"$release")
          existing_body=$(jq -r '.body // ""' <<<"$release")
          generated_body=$(gh api --method POST \
            "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f "tag_name=$GITHUB_REF_NAME" \
            --jq '.body')
          if [ -n "$existing_body" ]; then
            body=$(printf '%s\n\n%s' "$existing_body" "$generated_body")
          else
            body="$generated_body"
          fi
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" \
            -F draft=false \
            -F prerelease="$prerelease" \
            -F body="$body"

  publish-cli:
    name: Publish CLI package
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - name: Install trusted-publishing-compatible npm
        run: npm install --global npm@11.5.1
      - name: Show publish tool versions
        run: |
          node --version
          npm --version
      - name: Publish kotrain CLI
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag $GITHUB_REF_NAME does not contain a valid npm version." >&2
            exit 1
          fi
          npm pkg set "version=$version" --workspace=apps/cli
          npm install --package-lock-only --ignore-scripts
          published_version=$(npm view "agent-nekko@$version" version 2>/dev/null || true)
          if [ "$published_version" = "$version" ]; then
            echo "agent-nekko@$version is already published; skipping."
            exit 0
          fi
          npm ci
          npm run build:core
          npm run build -w @agent-nekko/host
          publish_args=(npm publish --workspace=apps/cli --access public)
          if [ -n "${NPM_TOKEN:-}" ]; then
            publish_args+=(--provenance)
            echo 'NPM_TOKEN is present; using token fallback for this publish.'
          else
            echo 'NPM_TOKEN is absent; attempting npm Trusted Publishing over OIDC.'
          fi
          set +e
          "${publish_args[@]}" 2>&1 | tee /tmp/kotrain-npm-publish.log
          publish_status=${PIPESTATUS[0]}
          set -e
          if [ "$publish_status" -ne 0 ]; then
            echo 'npm publish failed. Configure the npm Trusted Publisher for nekko-labs/agent-nekko/release.yml, or provide NPM_TOKEN during bootstrap.' >&2
            exit "$publish_status"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
