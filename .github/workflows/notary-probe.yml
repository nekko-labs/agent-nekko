name: Notary probe

# Diagnostic for release.yml's macOS notarization. A 401 from `notarytool
# submit` conflates two different problems: a *mangled* APPLE_API_KEY_P8 secret
# (literal \n, CRLF, truncation) and a key Apple rejects (revoked, or a key-id /
# issuer that no longer matches it). This probe separates them in seconds
# without running a release build: parse the .p8 locally, then make the cheapest
# authenticated notary call (`history`). Run it by hand whenever notarization
# fails.

on:
  workflow_dispatch:

permissions: {}

jobs:
  probe:
    runs-on: macos-latest
    env:
      APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
    steps:
      - name: Probe App Store Connect notary auth
        shell: bash
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/notary-api-key.p8"
          (umask 077; printf '%s' "$APPLE_API_KEY_P8" > "$key")

          echo '== 1. Does the stored .p8 parse as a PEM private key? =='
          if openssl pkey -in "$key" -noout 2>/dev/null; then
            echo 'p8 parses as a private key.'
          else
            echo 'APPLE_API_KEY_P8 does not parse. The stored secret is likely' >&2
            echo 'mangled (literal \n text, CRLF endings, or truncation).' >&2
            echo 'Re-set it from the original AuthKey_*.p8 per docs/signing.md.' >&2
            exit 1
          fi

          echo
          echo '== 2. Does Apple accept the key/id/issuer trio? =='
          echo 'Calling notarytool history (read-only, no submission).'
          if xcrun notarytool history \
              --key "$key" --key-id "$APPLE_API_KEY_ID" \
              --issuer "$APPLE_API_ISSUER" --output-format json | head -c 1000; then
            echo
            echo 'Auth OK: the trio is accepted. A release 401 would then be'
            echo 'about the submission itself, not these credentials.'
          else
            echo
            echo 'Apple rejected the credentials. Check App Store Connect ->' >&2
            echo 'Integrations -> App Store Connect API: is the key still Active?' >&2
            echo 'APPLE_API_ISSUER must be the issuer UUID, not the Team ID.' >&2
            exit 1
          fi
          rm -f "$key"
